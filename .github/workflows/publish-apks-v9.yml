name: Disponibilizar APKs V9
on:
  push:
    paths:
      - 'delivery-v9/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar e verificar os APKs assinados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          root = Path('delivery-v9')
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, expected in manifest.items():
              assert name in ('Mint-Browser-v9-senha-danill0.apk', 'Mint-Browser-v9-senha-87654321.apk')
              data = gzip.decompress((root / (name + '.gz')).read_bytes())
              assert hashlib.sha256(data).hexdigest() == expected, name
              Path(name).write_bytes(data)
              print('Verificado:', name, len(data))
          PY
      - name: Publicar APKs diretamente no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mint-Browser-v9-senha-danill0.apk Mint-Browser-v9-senha-87654321.apk
          git rm -r delivery-v9
          git commit -m "Disponibilizar os dois APKs V9 assinados para download direto"
          git push origin HEAD:main
