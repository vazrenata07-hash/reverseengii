name: Entregar Mint Windows V21
on:
  push:
    paths:
      - 'delivery-windows-v21/**'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar executaveis e verificar integridade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('delivery-windows-v21')
          manifest = json.loads((root / 'manifest.json').read_text())
          for item in manifest:
              data = b''.join((root / part).read_bytes() for part in item['parts'])
              assert hashlib.sha256(data).hexdigest() == item['sha256']
              Path(item['name']).write_bytes(data)
              print(item['name'], len(data))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mint-Browser-Windows-v21-danill0.exe Mint-Browser-Windows-v21-87654321.exe
          git rm -r delivery-windows-v21
          git commit -m "Publicar executaveis Mint Windows V21 com perfil Android"
          git push origin HEAD:main
