name: YC TV Lean Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youcine-lean/**'
      - '.github/workflows/yc-tv-lean.yml'

permissions:
  contents: write

concurrency:
  group: yc-tv-lean-build
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, package and sign
        run: python3 youcine-lean/build.py
      - name: Package sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('youcine-lean')
          with ZipFile(root / 'build/yc-tv-lean-v3-source.zip', 'w', ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and 'build' not in p.relative_to(root).parts and '__pycache__' not in p.parts:
                      z.write(p, p.as_posix())
          PY
      - name: Publish APK and source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=yc-tv-1.15.4-lean-v3
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'YC TV 1.15.4 — Lean v3 experimental' --notes-file youcine-lean/README.md
          fi
          gh release upload "$tag" youcine-lean/build/yc-tv-1.15.4-lean-v3.apk youcine-lean/build/SHA256SUMS.txt youcine-lean/build/yc-tv-lean-v3-source.zip --clobber
