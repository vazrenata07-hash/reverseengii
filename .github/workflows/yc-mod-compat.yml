name: Original mod compatibility APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youcine-mod-compat/**'
      - '.github/workflows/yc-mod-compat.yml'

permissions:
  contents: write

concurrency:
  group: yc-original-mod-compat
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare ELF tooling and native compiler
        run: |
          python3 -m pip install pyelftools==0.33
          ndk="$ANDROID_HOME/ndk/26.3.11579264"
          if [ ! -d "$ndk" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            ndk="$RUNNER_TEMP/android-ndk-r26d"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Compile and sign original mod compatibility patch
        run: python3 youcine-mod-compat/build.py --work /tmp/yc-mod-compat --out dist-mod-compat
      - uses: actions/upload-artifact@v4
        with:
          name: youcine-tv-mod-compat-v2
          path: dist-mod-compat/*
      - name: Publish separate APK release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create youcine-tv-mod-compat-v2 dist-mod-compat/* --target "$GITHUB_SHA" --title "YouCine TV — mod original, correção nativa Houdini v2" --notes-file youcine-mod-compat/release-notes.md --prerelease
